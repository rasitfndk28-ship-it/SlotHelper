name: Build Mod

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Forge MDK & Build
        run: |
          wget https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.0/forge-1.20.1-47.2.0-mdk.zip
          unzip forge-1.20.1-47.2.0-mdk.zip -d mdk
          cp -r src mdk/
          cd mdk
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v3
        with:
          name: SlotHelper-JAR
          path: mdk/build/libs/*.jar
